name: Checks

# Runs on every pull request and on every push to develop or main. It publishes nothing.
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Types
        run: |
          yarn typecheck
          yarn workspace @ohtuleht/templates typecheck
          yarn workspace @ohtuleht/api typecheck
          yarn workspace @ohtuleht/banner-runtime typecheck
          yarn workspace @ohtuleht/brand typecheck
      - name: Tests (golden banners, rules, gift card)
        run: yarn test
      - name: Build
        run: yarn build
      - name: Banner script weight
        run: yarn workspace @ohtuleht/banner-runtime size
      - name: First-load script weight
        run: node tools/check-bundle.mjs
      - name: Documents (links and anchors)
        run: yarn docs:check
